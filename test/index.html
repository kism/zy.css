<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>zy.css font test</title>
    <link rel="stylesheet" href="/static/zy.css" />
    <style>
      /* Every @font-face zy.css declares, so the browser actually fetches them all */
      .fc400 { font-family: 'Fira Code', monospace; font-weight: 400; }
      .fc500 { font-family: 'Fira Code', monospace; font-weight: 500; }
      .fc600 { font-family: 'Fira Code', monospace; font-weight: 600; }
      .fc700 { font-family: 'Fira Code', monospace; font-weight: 700; }
      .ns400 { font-family: 'Noto Sans Display', sans-serif; font-weight: 400; font-style: normal; }
      .ns400i { font-family: 'Noto Sans Display', sans-serif; font-weight: 400; font-style: italic; }
      .ns500 { font-family: 'Noto Sans Display', sans-serif; font-weight: 500; font-style: normal; }
      .ns500i { font-family: 'Noto Sans Display', sans-serif; font-weight: 500; font-style: italic; }
    </style>
  </head>
  <body>
    <p class="fc400">Fira Code 400</p>
    <p class="fc500">Fira Code 500</p>
    <p class="fc600">Fira Code 600</p>
    <p class="fc700">Fira Code 700</p>
    <p class="ns400">Noto Sans Display 400</p>
    <p class="ns400i">Noto Sans Display 400 italic</p>
    <p class="ns500">Noto Sans Display 500</p>
    <p class="ns500i">Noto Sans Display 500 italic</p>
  </body>
</html>
