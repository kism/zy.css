name: Fonts

on: [push, pull_request]

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - name: Check the fonts load
        run: bun run test
